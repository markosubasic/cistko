# Production stack: db, the API, a one-shot SPA publisher and Caddy.
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Requires the app tasks to have added apps/<app>/api and apps/<app>/web (see infra/*.Dockerfile).
name: cistko-prod

x-api: &api-defaults
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment: &api-env
    ENV: prod
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    CONTACT_EMAIL: ${CONTACT_EMAIL:?set CONTACT_EMAIL in .env}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-}
    GIT_SHA: ${GIT_SHA:-unknown}

services:
  db:
    build: ./infra/db
    image: datathon-2026-db:prod
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -h 127.0.0.1 -d nabavaradar']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  cistko-api:
    <<: *api-defaults
    build:
      context: .
      dockerfile: infra/python-api.Dockerfile
      args: { APP: cistko }
    image: datathon-2026-cistko-api:prod
    environment:
      <<: *api-env
      APP_NAME: cistko
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/cistko
      PUBLIC_BASE_URL: https://${CISTKO_HOST:?set CISTKO_HOST in .env}
      CORS_ORIGINS: https://${CISTKO_HOST}
      RATE_LIMIT: ${CISTKO_RATE_LIMIT:-300/minute}
    volumes:
      - cistko-data:/data

  cistko-web:
    build: { context: ., dockerfile: infra/web.Dockerfile, args: { APP: cistko } }
    image: datathon-2026-cistko-web:prod
    volumes: ['srv:/srv']
    restart: 'no'
  caddy:
    image: caddy:2
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      CISTKO_HOST: ${CISTKO_HOST:?set CISTKO_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - srv:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      cistko-web: { condition: service_completed_successfully }
      cistko-api: { condition: service_started }
    restart: unless-stopped

volumes:
  pgdata:
  cistko-data:
  srv:
  caddy_data:
  caddy_config:
