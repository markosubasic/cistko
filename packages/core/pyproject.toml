[project]
name = "opendata-core"
version = "0.1.0"
description = "Shared foundation (config, HTTP, provenance, CKAN, geo, API factory) for the datathon-2026 apps"
requires-python = ">=3.12,<3.13"
license = { text = "EUPL-1.2" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2",
  "pydantic-settings>=2",
  "sqlalchemy>=2",
  "geoalchemy2>=0.15",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "httpx>=0.27",
  "tenacity>=9",
  "structlog>=24",
  "typer>=0.12",
  "jinja2>=3.1",
  "shapely>=2",
  "pyproj>=3.6",
  "geopandas>=1",
  "numpy>=1.26",
  "scipy>=1.13",
  "rapidfuzz>=3.9",
  "slowapi>=0.1.9",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3", "pgvector>=0.3"]
graph = ["osmnx>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opendata_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not slow\""
markers = [
  "live: hits the real network; skipped unless RUN_LIVE=1",
  "slow: slow test (e.g. downloads an ML model); run with -m slow",
  "db: needs a PostGIS database; skipped unless TEST_DATABASE_URL is set",
]

[tool.coverage.run]
source = ["opendata_core"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
