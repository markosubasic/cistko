[project]
name = "cistko-api"
version = "0.1.0"
description = "Čistko: illegally dumped waste, municipal separate-collection rates and waste facilities of Croatia (API + ingestion CLI)"
requires-python = ">=3.12,<3.13"
license = { text = "EUPL-1.2" }
dependencies = ["opendata-core"]

[project.scripts]
cistko = "cistko_api.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cistko_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not slow\""
markers = [
  "live: hits the real network; skipped unless RUN_LIVE=1",
  "slow: slow test; run with -m slow",
  "db: needs PostGIS; skipped unless TEST_DATABASE_URL is set",
]

[tool.uv.sources]
opendata-core = { workspace = true }
